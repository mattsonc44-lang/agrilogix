    // ── Render: Vendors Tab ─────────────────────────────────────────────────

    function renderAllTodos() {
      const vehicles = data.vehicles || [];
      const customers = data.customers || [];

      // Build flat list of all todos with vehicle context
      const allItems = [];
      vehicles.forEach(v => {
        (v.todos||[]).forEach(t => {
          allItems.push({todo:t, vehicle:v, cust:customers.find(c=>c.id===v.customerId)});
        });
      });

      const open   = allItems.filter(i=>!i.todo.done);
      const done   = allItems.filter(i=>i.todo.done);

      // Sort open: high first, then medium, then low; within priority by vehicle name
      const priOrder = {high:0,medium:1,low:2};
      open.sort((a,b)=>(priOrder[a.todo.priority||'medium']||1)-(priOrder[b.todo.priority||'medium']||1)||a.vehicle.name.localeCompare(b.vehicle.name));

      const priColor = {high:'#dc2626',medium:'#d97706',low:'#16a34a'};
      const priBg    = {high:'rgba(220,38,38,.08)',medium:'rgba(217,119,6,.08)',low:'rgba(22,163,74,.08)'};

      function todoCard(item, showDone) {
        const t=item.todo, v=item.vehicle, c=item.cust;
        return `<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-left:3px solid ${priColor[t.priority||'medium']};border-radius:6px;margin-bottom:8px;${showDone?'opacity:.6':''}">
          <input type="checkbox" class="todo-cb no-print" data-action="todo-toggle" data-vid="${esc(v.id)}" data-tid="${esc(t.id)}" ${t.done?'checked':''} style="margin-top:3px" />
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:600;color:var(--text-bright);${showDone?'text-decoration:line-through;color:var(--text-dim)':''}">${esc(t.text)}</div>
            ${t.notes?`<div style="font-size:13px;color:var(--text-dim);margin-top:2px">${esc(t.notes)}</div>`:''}
            <div style="display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap">
              <span style="font-size:12px;font-weight:600;color:var(--amber-dim);cursor:pointer" data-action="nav-to-vehicle" data-id="${esc(v.id)}" data-cust="${esc(v.customerId)}">${esc(v.name)}</span>
              ${c?`<span style="font-size:11px;color:var(--text-dim)">${esc(c.name)}</span>`:''}
              ${t.createdAt?`<span style="font-size:11px;color:var(--text-dim)">${t.createdAt}</span>`:''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
            <span style="font-size:10px;font-family:'Share Tech Mono',monospace;letter-spacing:1px;padding:2px 8px;border-radius:10px;background:${priBg[t.priority||'medium']};color:${priColor[t.priority||'medium']}">${(t.priority||'MEDIUM').toUpperCase()}</span>
            <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px;color:#2563eb;border-color:rgba(37,99,235,.3)" data-action="todo-convert-service" data-vid="${esc(v.id)}" data-tid="${esc(t.id)}">→ Log Service</button>
            <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px" data-action="todo-edit" data-vid="${esc(v.id)}" data-tid="${esc(t.id)}">Edit</button>
          </div>
        </div>`;
      }

      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
          <div>
            <div class="overview-title">To-Do List</div>
            <div class="overview-sub">${open.length} open task${open.length!==1?'s':''} · ${done.length} completed</div>
          </div>
          <div style="display:flex;gap:8px">
            ${open.filter(i=>i.todo.priority==='high').length?`<span style="padding:4px 12px;border-radius:12px;background:rgba(220,38,38,.1);color:#dc2626;font-size:13px;font-weight:600">🔴 ${open.filter(i=>i.todo.priority==='high').length} High</span>`:''}
            ${open.filter(i=>(i.todo.priority||'medium')==='medium').length?`<span style="padding:4px 12px;border-radius:12px;background:rgba(217,119,6,.1);color:#d97706;font-size:13px;font-weight:600">🟡 ${open.filter(i=>(i.todo.priority||'medium')==='medium').length} Medium</span>`:''}
            ${open.filter(i=>i.todo.priority==='low').length?`<span style="padding:4px 12px;border-radius:12px;background:rgba(22,163,74,.1);color:#16a34a;font-size:13px;font-weight:600">🟢 ${open.filter(i=>i.todo.priority==='low').length} Low</span>`:''}
          </div>
        </div>

        ${open.length===0 && done.length===0
          ? `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">No Tasks Yet</div><div style="font-size:14px">Open a vehicle in the Fleet tab and add tasks to its To-Do list.</div></div>`
          : ''}

        ${open.length>0 ? `
          <div style="font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px">Open Tasks</div>
          ${open.map(i=>todoCard(i,false)).join('')}
        ` : ''}

        ${done.length>0 ? `
          <div style="font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin:16px 0 10px">Completed</div>
          ${done.map(i=>todoCard(i,true)).join('')}

    // ── Render: Global Search Tab ───────────────────────────────────────────
    function renderGlobalSearch() {
      const q = (window._gsq||'').trim().toLowerCase();
      let results = [];
      if (q.length >= 2) {
        const vehicles = data.vehicles||[];
        const records  = data.records||[];
        const inv      = data.partsInventory||[];
        // Records
        records.filter(r=>(r.notes+r.type+r.partnum+(r.parts||[]).map(p=>p.desc+p.num).join('')).toLowerCase().includes(q))
          .slice(0,20).forEach(r=>{
            const v=vehicles.find(v=>v.id===r.vehicleId);
            results.push({type:'record',label:`${v?.name||'?'} — ${r.type} (${r.date})`,sub:r.notes?.slice(0,80),id:r.vehicleId,custId:v?.customerId});
          });
        // Vehicles
        vehicles.filter(v=>(v.name+v.make+v.model+v.vin+v.notes).toLowerCase().includes(q))
          .slice(0,10).forEach(v=>results.push({type:'vehicle',label:v.name,sub:`${v.type}${v.year?' · '+v.year:''}`,id:v.id,custId:v.customerId}));
        // Parts inventory
        inv.filter(p=>(p.name+(p.partNumbers||[]).map(n=>n.num+n.vendor).join('')).toLowerCase().includes(q))
          .slice(0,10).forEach(p=>results.push({type:'part',label:p.name,sub:`Qty: ${p.qty||'?'}${p.location?' · '+p.location:''}`}));
      }
      return `
        <div class="overview-title" style="margin-bottom:12px">🔍 Search</div>
        <input id="gs-input" class="form-input" value="${esc(window._gsq||'')}" placeholder="Search records, vehicles, parts..." data-action="gs-search" autocomplete="off" style="font-size:16px;padding:12px 14px;margin-bottom:16px" />
        ${q.length>=2?`<div class="overview-sub" style="margin-bottom:12px">${results.length} result${results.length!==1?'s':''} for "${esc(q)}"</div>`:q?`<div class="overview-sub" style="margin-bottom:8px">Type at least 2 characters...</div>`:''}
        ${results.map(r=>`<div style="background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin-bottom:8px;${r.id?'cursor:pointer':''}" ${r.id?`data-action="gs-nav" data-id="${esc(r.id)}" data-cust-id="${esc(r.custId||'')}"`:''}">
          <div style="font-size:11px;font-family:'Share Tech Mono',monospace;color:var(--amber-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">${r.type}</div>
          <div style="font-weight:600">${esc(r.label)}</div>
          ${r.sub?`<div style="font-size:13px;color:var(--text-dim)">${esc(r.sub)}</div>`:''}
        </div>`).join('')}`;
    }

    function renderPartsToOrder() {

        if(pf.q && !(p.desc+p.num+p.vendor).toLowerCase().includes(pf.q.toLowerCase())) return false;

        if(pf.num && (p.num||'').toLowerCase()!==pf.num.toLowerCase()) return false;
        if(pf.vehicle && p.vehicleId!==pf.vehicle) return false;

      if      (modalState.type==='vehicle')       modal = vehicleModalHTML(modalState.target);
      else if (modalState.type==='record')         modal = recordModalHTML(modalState.target);
      else if (modalState.type==='customer')       modal = customerModalHTML(modalState.target);
      else if (modalState.type==='vendor')         modal = vendorModalHTML(modalState.target);
      else if (modalState.type==='receive-part')   modal = receivePartModalHTML(modalState.target);
      else if (modalState.type==='add-parts-to-svc') modal = addPartsToServiceModalHTML(modalState.parts);
      else if (modalState.type==='edit-order-part') modal = editOrderPartModalHTML(modalState.target);
      else if (modalState.type==='inv-item')       modal = invItemModalHTML(modalState.target);
      else if (modalState.type==='part-num')       modal = partNumModalHTML(modalState.itemId, modalState.target);
      else if (modalState.type==='todo-edit')      modal = todoModalHTML(modalState.vehicle, modalState.todo);
      else if (modalState.type==='inv-dupes')      modal = invDupesModalHTML();
      else if (modalState.type==='pin-set')        modal = renderPinScreen('set');
      return modal;

    // ── Event Dispatch ──────────────────────────────────────────────────────
    document.getElementById('app').addEventListener('click', function(e) {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      const id     = el.dataset.id || '';

      if (action==='pin-digit') {
        const digit=el.dataset.digit;
        if(pinEntry.length>=6)return;
        pinEntry+=digit;
        const pin=getPin();
        const mode=window._pinMode||'enter';
        if(mode==='enter'){
          if(pinEntry.length>=(pin.length||4)){
            if(pinEntry===pin){pinError='';unlock();pinEntry='';window._pinMode=null;render();}
            else{pinError='Incorrect PIN';pinEntry='';document.getElementById('app').innerHTML=renderPinScreen('enter');}
          } else { document.getElementById('app').innerHTML=renderPinScreen('enter'); }
        } else if(mode==='set'){
          if(pinEntry.length>=4){window._pinConfirm=pinEntry;pinEntry='';window._pinMode='confirm';document.getElementById('app').innerHTML=renderPinScreen('confirm');}
          else{document.getElementById('app').innerHTML=renderPinScreen('set');}
        } else if(mode==='confirm'){
          if(pinEntry.length>=window._pinConfirm.length){
            if(pinEntry===window._pinConfirm){localStorage.setItem(PIN_KEY,pinEntry);pinError='';pinEntry='';window._pinMode=null;window._pinConfirm=null;unlock();render();}
            else{pinError='PINs did not match — try again';pinEntry='';window._pinMode='set';window._pinConfirm=null;document.getElementById('app').innerHTML=renderPinScreen('set');}
          } else{document.getElementById('app').innerHTML=renderPinScreen('confirm');}
        }
      } else if(action==='pin-del'){
        pinEntry=pinEntry.slice(0,-1);pinError='';
        document.getElementById('app').innerHTML=renderPinScreen(window._pinMode||'enter');
      } else if(action==='admin-set-pin'){pinEntry='';pinError='';window._pinMode='set';document.getElementById('app').innerHTML=renderPinScreen('set');
      } else if(action==='admin-change-pin'){pinEntry='';pinError='';window._pinMode='set';document.getElementById('app').innerHTML=renderPinScreen('set');
      } else if(action==='admin-remove-pin'){if(!confirm('Remove PIN?'))return;localStorage.removeItem(PIN_KEY);render();

      } else if(action==='tab-fleet'){appView='fleet';render();
      } else if(action==='tab-report'){appView='report';render();
      } else if(action==='tab-costs'){appView='costs';render();
      } else if(action==='tab-invoices'){appView='invoices';render();
      } else if(action==='tab-order'){appView='order';render();
      } else if(action==='tab-parts'){appView='parts';render();
      } else if(action==='tab-todos'){appView='todos';render();
      } else if(action==='tab-vendors'){appView='vendors';render();
      } else if(action==='tab-orderhistory'){appView='orderhistory';render();
      } else if(action==='tab-search'){appView='search';render();
      } else if(action==='tab-admin'){appView='admin';render();


      } else if(action==='select-customer'){
        selectedCustomerId=id;selectedId='';sidebarSearch='';appView='fleet';render();
      } else if(action==='back-to-customers'){
        selectedCustomerId='';selectedId='';sidebarSearch='';appView='fleet';render();
      } else if(action==='sidebar-search'){
        // handled by input event
      } else if(action==='nav-to-vehicle'){
        selectedId=id;selectedCustomerId=el.dataset.cust||'';appView='fleet';render();
      } else if(action==='select-vehicle'){
        const v=data.vehicles.find(v=>v.id===id);
        if(v){selectedId=v.id;selectedCustomerId=v.customerId;appView='fleet';render();}
      } else if(action==='select'){
        const v=data.vehicles.find(v=>v.id===id);
        if(v){selectedId=v.id;selectedCustomerId=v.customerId;appView='fleet';render();}
      } else if(action==='gs-nav'){
        selectedId=id;selectedCustomerId=el.dataset.custId||'';appView='fleet';render();

      } else if(action==='close-modal'){modalState=null;render();

      } else if(action==='add-vehicle'){modalState={type:'vehicle',target:null};render();
      } else if(action==='edit-vehicle'){
        const v=data.vehicles.find(v=>v.id===id)||null;
        modalState={type:'vehicle',target:v};render();
      } else if(action==='del-vehicle'){
        if(!confirm('Delete this vehicle and all its service records?'))return;
        const vehicles=data.vehicles.filter(v=>v.id!==id);
        const records=data.records.filter(r=>r.vehicleId!==id);
        selectedId='';render();update({...data,vehicles,records});
      } else if(action==='save-vehicle'){
        const name=document.getElementById('f-veh-name')?.value?.trim()||'';
        if(!name){alert('Name required.');return;}
        const vObj={
          name,type:document.getElementById('f-veh-type')?.value||'Other',
          customerId:document.getElementById('f-veh-cust')?.value||'',
          year:document.getElementById('f-veh-year')?.value?.trim()||'',
          make:document.getElementById('f-veh-make')?.value?.trim()||'',
          model:document.getElementById('f-veh-model')?.value?.trim()||'',
          vin:document.getElementById('f-veh-vin')?.value?.trim()||'',
          engine:document.getElementById('f-veh-engine')?.value?.trim()||'',
          hp:document.getElementById('f-veh-hp')?.value?.trim()||'',
          hours:document.getElementById('f-veh-hours')?.value?.trim()||'',
          notes:document.getElementById('f-veh-notes')?.value?.trim()||'',
        };
        if(modalState.target){
          update({...data,vehicles:data.vehicles.map(v=>v.id===modalState.target.id?{...modalState.target,...vObj}:v)});
        } else {
          const nv={id:uid(),...vObj,todos:[]};
          update({...data,vehicles:[...data.vehicles,nv]});
          selectedId=nv.id;selectedCustomerId=vObj.customerId;appView='fleet';
        }
        modalState=null;render();

      } else if(action==='add-record'){
        if(!selectedId){alert('Please select a vehicle first.');return;}
        modalState={type:'record',target:null,prefill:null};render();
      } else if(action==='edit-record'){
        const r=data.records.find(r=>r.id===id)||null;
        if(r)modalState={type:'record',target:r,editOldParts:getPartsArray(r)};render();
      } else if(action==='del-record'){
        if(!confirm('Delete this service record?'))return;
        const r=data.records.find(r=>r.id===id);
        if(r&&confirm('Return parts to inventory?')){
          let inv=data.partsInventory||[];
          getPartsArray(r).forEach(p=>{if(p.invPartId){const qty=parseInt(p.qtyUsed)||1;inv=inv.map(ip=>ip.id===p.invPartId?{...ip,qty:String((parseInt(ip.qty)||0)+qty)}:ip);}});
          update({...data,records:data.records.filter(r=>r.id!==id),partsInventory:inv});
        } else {
          update({...data,records:data.records.filter(r=>r.id!==id)});
        }
        modalState=null;render();
      } else if(action==='save-record'){
        const date=document.getElementById('f-date')?.value||'';
        const type=document.getElementById('f-type')?.value?.trim()||'';
        if(!date||!type){alert('Date and service type required.');return;}
        const cost=document.getElementById('f-cost')?.value?.trim()||'';
        const hours=document.getElementById('f-hours')?.value?.trim()||'';
        const tech=document.getElementById('f-tech')?.value?.trim()||'';
        const notes=document.getElementById('f-notes')?.value?.trim()||'';
        // Collect parts
        const partEntries=[...document.querySelectorAll('.part-entry')];
        const parts=partEntries.map(pe=>({
          desc:pe.querySelector('.part-desc-input')?.value?.trim()||'',
          num:pe.querySelector('.part-num-input')?.value?.trim()||'',
          qtyUsed:pe.querySelector('.part-qty-input')?.value?.trim()||'1',
          cost:pe.querySelector('.part-cost-input')?.value?.trim()||'',
          invPartId:pe.dataset.invId||'',
          pnId:pe.dataset.pnId||'',
        })).filter(p=>p.desc||p.num);

        let partsInventory=data.partsInventory||[];
        // If editing, restore old part qtys
        if(modalState.target&&modalState.editOldParts){
          modalState.editOldParts.forEach(p=>{if(p.invPartId){const qty=parseInt(p.qtyUsed)||1;partsInventory=partsInventory.map(ip=>ip.id===p.invPartId?{...ip,qty:String((parseInt(ip.qty)||0)+qty)}:ip);}});
        }
        // Deduct new qtys
        parts.forEach(p=>{if(p.invPartId){const qty=parseInt(p.qtyUsed)||1;partsInventory=partsInventory.map(ip=>ip.id===p.invPartId?{...ip,qty:String(Math.max(0,(parseInt(ip.qty)||0)-qty))}:ip);}});

        const rec={date,type,cost,hours,tech,notes,parts,partnum:parts.map(p=>p.num).filter(Boolean).join(', ')};
        let records;
        if(modalState.target){
          records=data.records.map(r=>r.id===modalState.target.id?{...modalState.target,...rec}:r);

        const text=document.getElementById('f-todo-text')?.value?.trim()||'';
        if(!text){alert('Task text required.');return;}
        const pri=document.getElementById('f-todo-pri')?.value||'medium';
        const notes=document.getElementById('f-todo-notes')?.value?.trim()||'';
        const v=modalState.vehicle;
        const todos=(v.todos||[]).map(t=>t.id===modalState.todo.id?{...t,text,priority:pri,notes}:t);
        const vehicles=data.vehicles.map(vv=>vv.id===v.id?{...vv,todos}:vv);
        update({...data,vehicles});modalState=null;render();

      } else if(action==='print-service-history'){
        const v=data.vehicles.find(v=>v.id===id);
        if(!v)return;
        const vRecs=data.records.filter(r=>r.vehicleId===id).sort((a,b)=>b.date.localeCompare(a.date));
        const cust=(data.customers||[]).find(c=>c.id===v.customerId);
        const biz=data.settings?.businessName||'';
        const totalCost=vRecs.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
        const w=window.open('','_blank','width=900,height=700');
        w.document.write(`<!DOCTYPE html><html><head><title>Service History - ${v.name}</title><style>body{font-family:Arial,sans-serif;padding:30px;max-width:860px;margin:0 auto;color:#111}h1{font-size:22px;margin:0}h2{font-size:15px;font-weight:normal;color:#666;margin:4px 0 0}.meta{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0;padding:12px 16px;background:#f8f9fa;border-radius:4px}.meta-item{font-size:12px}.meta-lbl{color:#9ca3af;text-transform:uppercase;letter-spacing:1px;font-size:10px}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}th{text-align:left;padding:8px 10px;border-bottom:2px solid #e5e7eb;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#6b7280}td{padding:8px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top}.cost{font-weight:600;color:#16a34a;text-align:right}.total{font-weight:700;font-size:14px}@media print{body{padding:15px}}</style></head><body>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
            <div><h1>${v.name}</h1><h2>${[v.year,v.make,v.model].filter(Boolean).join(' ')}${v.engine?' · '+v.engine:''}</h2></div>
            ${biz?`<div style="text-align:right;font-size:13px;color:#374151"><strong>${biz}</strong>${cust?'<br>'+cust.name:''}</div>`:''}
          </div>
          <div class="meta">
            ${v.vin?`<div class="meta-item"><div class="meta-lbl">VIN / Serial</div>${v.vin}</div>`:''}
            ${v.hours?`<div class="meta-item"><div class="meta-lbl">Hours / Miles</div>${Number(v.hours).toLocaleString()}</div>`:''}
            <div class="meta-item"><div class="meta-lbl">Total Records</div>${vRecs.length}</div>
            <div class="meta-item"><div class="meta-lbl">Total Cost</div>$${totalCost.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
            ${vRecs[0]?`<div class="meta-item"><div class="meta-lbl">Last Service</div>${vRecs[0].date}</div>`:''}
            <div class="meta-item"><div class="meta-lbl">Printed</div>${new Date().toLocaleDateString()}</div>
          </div>
          <table><thead><tr><th>Date</th><th>Service Type</th><th>Notes</th><th>Parts</th><th>Tech</th><th style="text-align:right">Cost</th></tr></thead>
          <tbody>${vRecs.map(r=>{const pa=getPartsArray(r);const partsHtml=pa.map(p=>[p.desc,p.num,p.cost?'$'+Number(p.cost).toLocaleString():''].filter(Boolean).join(' · ')).join('<br>');const notes=getCleanNotes(r);return`<tr><td style="white-space:nowrap">${r.date}</td><td style="white-space:nowrap">${r.type||''}</td><td>${notes||''}</td><td style="font-size:11px;color:#6b7280">${partsHtml}</td><td>${r.tech||''}</td><td class="cost">${r.cost?'$'+Number(r.cost).toLocaleString():''}</td></tr>`;}).join('')}
          <tr style="border-top:2px solid #e5e7eb"><td colspan="5" class="total" style="text-align:right">Total:</td><td class="cost total">$${totalCost.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr></tbody></table>
        </body></html>`);
        w.document.close();w.focus();setTimeout(function(){w.print();},400);

      } else if(action==='run-parts-migration'){
        const inv=data.partsInventory||[];
        const migrated=migratePartsInventoryToNewStructure(inv);
        const count=inv.filter(p=>!p.partNumbers).length;
        update({...data,partsInventory:migrated});
        alert('Migration complete! '+count+' item(s) converted.\n\nEach item now shows in Parts Inventory with its part number listed below it.');
      } else if(action==='save-settings-admin'){
        const bname=document.getElementById('f-biz-name-admin')?.value?.trim()||'';
        update({...data,settings:{...(data.settings||{}),businessName:bname}});
      } else if(action==='toggle-feature'){
        const key=el.dataset.key;
        const features={...(data.settings?.features||{})};
        features[key]=!features[key];
        update({...data,settings:{...(data.settings||{}),features}});
      } else if(action==='qb-set-mode'){
        const mode=el.dataset.mode;
        update({...data,settings:{...data.settings,qb:{...(data.settings?.qb||{}),mode}}});
      } else if(action==='qb-save-settings'){
        const qb={...(data.settings?.qb||{}),serviceAccount:document.getElementById('qb-svc-acct')?.value?.trim()||'Service',partsAccount:document.getElementById('qb-parts-acct')?.value?.trim()||'Parts',laborAccount:document.getElementById('qb-labor-acct')?.value?.trim()||'Labor',taxAccount:document.getElementById('qb-tax-acct')?.value?.trim()||''};
        update({...data,settings:{...data.settings,qb}});
      } else if(action==='qb-export-all-iif'){exportInvoicesIIF(null);
      } else if(action==='qb-export-customers-iif'){exportCustomersIIF();
      } else if(action==='qb-export-all-csv'){exportInvoicesCSV(null);
      } else if(action==='qb-export-customers-csv'){exportCustomersCSV();

      } else if(action==='po-toggle-sel'){
        if(selectedOrderPartIds.has(id))selectedOrderPartIds.delete(id);else selectedOrderPartIds.add(id);render();
      } else if(action==='po-clear-sel'){selectedOrderPartIds.clear();render();
      } else if(action==='po-sel-all'){
        const allIds=(data.partsToOrder||[]).map(p=>p.id);
        if(selectedOrderPartIds.size===allIds.length)selectedOrderPartIds.clear();else allIds.forEach(id=>selectedOrderPartIds.add(id));render();
      } else if(action==='inv-select-all-po'){
        (data.partsToOrder||[]).forEach(p=>selectedOrderPartIds.add(p.id));render();
      } else if(action==='po-add-to-service'){
        const parts=[...selectedOrderPartIds].map(id=>(data.partsToOrder||[]).find(p=>p.id===id)).filter(Boolean);
        if(!parts.length)return;
        const defaultVehId=parts.map(p=>p.vehicleId).find(v=>v&&v!=='__stock__')||'';
        modalState={type:'add-parts-to-svc',parts,defaultVehicleId:defaultVehId};render();
      } else if(action==='save-parts-to-service'){
        const vehicleId=document.getElementById('f-ats-vehicle')?.value||'';
        if(!vehicleId){alert('Please select a vehicle.');return;}
        const date=document.getElementById('f-ats-date')?.value||new Date().toISOString().slice(0,10);
        const type=document.getElementById('f-ats-type')?.value?.trim()||'Repair';
        const notes=document.getElementById('f-ats-notes')?.value?.trim()||'';
        const hours=document.getElementById('f-ats-hours')?.value?.trim()||'';
        const tech=document.getElementById('f-ats-tech')?.value?.trim()||'';
        const parts=modalState.parts||[];
        const qtyInputs=document.querySelectorAll('.ats-qty-input');
        const partsArr=parts.map((p,idx)=>{const qtyUsed=qtyInputs[idx]?.value?.trim()||p.qty||'1';return{desc:p.desc||'',num:p.num||'',cost:p.unitCost||'',qtyUsed,invPartId:p.invPartId||''};});
        const totalCost=partsArr.reduce((s,p)=>s+(parseFloat(p.cost)||0)*(parseInt(p.qtyUsed||1)),0);
        let vehicles=data.vehicles;
        if(hours){vehicles=vehicles.map(v=>v.id===vehicleId&&Number(hours)>Number(v.hours||0)?{...v,hours}:v);}
        let partsInventory=data.partsInventory||[];
        partsArr.forEach(function(p){if(p.invPartId){const qty=parseInt(p.qtyUsed)||1;partsInventory=partsInventory.map(function(ip){return ip.id===p.invPartId?{...ip,qty:String(Math.max(0,(parseInt(ip.qty)||0)-qty))}:ip;});}});
        const newRecord={id:uid(),vehicleId,date,type,notes,tech,hours,parts:partsArr,cost:totalCost?String(totalCost):'',partnum:''};
        // Auto-archive the order parts that were used
        const usedIds=new Set(parts.map(p=>p.id));
        const today=new Date().toISOString().slice(0,10);
        const toArchive=(data.partsToOrder||[]).filter(p=>usedIds.has(p.id));
        const archivedItems=toArchive.map(p=>({...p,
          receivedDate:today,
          serviceRecordId:newRecord.id,
          serviceNote:'Added to service: '+type+(vehicleId?(data.vehicles.find(v=>v.id===vehicleId)?.name?(' on '+(data.vehicles.find(v=>v.id===vehicleId)?.name)):''):''),
        }));
        const remainingParts=(data.partsToOrder||[]).filter(p=>!usedIds.has(p.id));
        const orderHistory=[...(data.orderHistory||[]),...archivedItems];
        selectedOrderPartIds.clear();modalState=null;
        const v=data.vehicles.find(v=>v.id===vehicleId);
        if(v){appView='fleet';selectedCustomerId=v.customerId;selectedId=vehicleId;}
        update({...data,vehicles,partsInventory,records:[...data.records,newRecord],partsToOrder:remainingParts,orderHistory});

      } else if(action==='open-settings'){appView='admin';render();
      }

      // Custom select dropdowns
      const invPick=e.target.closest('[data-action="cs-inv-pick"]');
      if(invPick){
        if(!window._invFilters)window._invFilters={q:'',vendor:'',location:''};
        window._invFilters[invPick.dataset.field]=invPick.dataset.val;
        const dd=invPick.closest('.cs-dropdown');if(dd)dd.style.display='none';
        _csOpen=null;render();return;
      }
      const pick=e.target.closest('[data-action="cs-pick"]');
      if(pick){
        poFilters[pick.dataset.field]=pick.dataset.val;
        const dd=document.getElementById('cs-'+pick.dataset.cs);
        if(dd)dd.style.display='none';
        _csOpen=null;render();return;
      }
      if(action==='cs-open'){csPosition(el);return;}

      // Parts picker
      const numOpt=e.target.closest('#gpp .ppi');
      if(numOpt&&_ppMode){applyPP(numOpt);return;}
      if(e.target.classList.contains('part-num-input')){showPP(e.target,'num');return;}
      if(e.target.classList.contains('part-desc-input')){showPP(e.target,'desc');return;}

      // Click outside — close all dropdowns
      if(_csOpen&&!e.target.closest('.cs-dropdown')&&!e.target.closest('.cs-wrap')){
        document.querySelectorAll('.cs-dropdown').forEach(d=>d.style.display='none');
        _csOpen=null;
      }
      if(_ppInput&&!e.target.closest('#gpp')&&!e.target.classList.contains('part-desc-input')&&!e.target.classList.contains('part-num-input')){hidePP();}
    }); // end click handler

    // ── Input events ────────────────────────────────────────────────────────
    document.getElementById('app').addEventListener('input', function(e) {
      if(e.target.id==='sidebar-search-input'){
        sidebarSearch=e.target.value;
        const pos=e.target.selectionStart;
        render();
        const si=document.getElementById('sidebar-search-input');
        if(si){si.focus();si.setSelectionRange&&si.setSelectionRange(pos,pos);}
        return;
      }
      if(e.target.id==='gs-input'){window._gsq=e.target.value;render();const el=document.getElementById('gs-input');if(el){el.focus();el.setSelectionRange&&el.setSelectionRange(el.value.length,el.value.length);}return;}
      if(e.target.id==='po-q'){
        poFilters['q']=e.target.value;
        const pos=e.target.selectionStart;
        render();
        const el=document.getElementById('po-q');
        if(el){el.focus();el.setSelectionRange&&el.setSelectionRange(pos,pos);}
        return;
      }
      if(e.target.id==='inv-fq'){if(!window._invFilters)window._invFilters={q:'',vendor:'',location:'',vehicle:''};window._invFilters.q=e.target.value;render();const el=document.getElementById('inv-fq');if(el){el.focus();el.setSelectionRange&&el.setSelectionRange(el.value.length,el.value.length);}return;}
      if(e.target.classList&&e.target.classList.contains('part-num-input'))showPP(e.target,'num');
      if(e.target.classList&&e.target.classList.contains('part-desc-input'))showPP(e.target,'desc');
    },true);

    // ── CS search filter ────────────────────────────────────────────────────
    document.addEventListener('input', function(e) {
      const csKey=e.target.dataset.csSearch;if(!csKey)return;
      const q=e.target.value.toLowerCase().trim();
      const dd=document.getElementById('cs-'+csKey);if(!dd)return;
      dd.querySelectorAll('.cs-option').forEach(function(opt){opt.style.display=(!q||opt.dataset.val===''||opt.textContent.toLowerCase().includes(q))?'':'none';});
    });
    document.addEventListener('keydown', function(e) {
      if(e.key==='Escape'&&_csOpen){document.querySelectorAll('.cs-dropdown').forEach(d=>d.style.display='none');_csOpen=null;}
    });

    // ── Document-level price search ─────────────────────────────────────────
    document.addEventListener('click', function(e) {
      const btn=e.target.closest('[data-action="po-price-search"]');
      if(!btn)return;
      const pid=btn.dataset.id;
      const p=(data.partsToOrder||[]).find(p=>p.id===pid);
      if(!p){const row=btn.closest('tr');if(row){const desc=row.cells?.[2]?.textContent?.trim()||'';const num=row.cells?.[3]?.textContent?.trim()||'';showPricePanel(btn,desc,num);}return;}
      showPricePanel(btn,p.desc||'',p.num||'');
    });

    // ── Parts picker mousedown ──────────────────────────────────────────────
    document.addEventListener('mousedown', function(e) {
      const pk=document.getElementById('gpp');
      if(!pk||pk.style.display==='none')return;
      const opt=e.target.closest('.ppi');
      if(opt&&pk.contains(opt)){e.preventDefault();applyPP(opt);return;}
      if(!pk.contains(e.target)&&e.target!==_ppInput)hidePP();
    },true);
    document.addEventListener('input', function(e) {
      if(e.target.classList&&e.target.classList.contains('part-desc-input'))showPP(e.target,'desc');
      else if(e.target.classList&&e.target.classList.contains('part-num-input'))showPP(e.target,'num');
    },true);
    document.addEventListener('click', function(e) {
      if(e.target.classList&&e.target.classList.contains('part-desc-input')){showPP(e.target,'desc');return;}
      if(e.target.classList&&e.target.classList.contains('part-num-input')){showPP(e.target,'num');return;}
    },true);

    // ── CS Position helper ──────────────────────────────────────────────────
    let _csOpen = null;
    function csPosition(btn) {
      const dd=document.getElementById('cs-'+btn.dataset.cs);
      if(!dd)return;
      const rect=btn.getBoundingClientRect();
      dd.style.top=(rect.bottom+2)+'px';
      dd.style.left=rect.left+'px';
      dd.style.minWidth=rect.width+'px';
      dd.style.display='block';
      _csOpen=btn.dataset.cs;
      const searchEl=dd.querySelector('.cs-search');
      if(searchEl){
        searchEl.value='';
        dd.querySelectorAll('.cs-option').forEach(o=>o.style.display='');
        setTimeout(function(){searchEl.focus();},30);
      }
    }

    // ── Duplicate check for Order Parts ────────────────────────────────────
    function applyDuplicateCheck(num, vendor, desc, qty, vehicleId, invPartId, onOk) {
      if(num){
        const existing=(data.partsToOrder||[]).find(p=>(p.num||'').toLowerCase()===num.toLowerCase()&&!p.received);
        if(existing){if(!confirm('Part# '+num+' already in order list. Add anyway?'))return;}
      }
      onOk();
    }

    // ── Notification helpers ────────────────────────────────────────────────
    function requestNotifPermission() {
      if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
    }
    function checkZeroStockNotifications(prev, next) {
      if(!getFeature('partsNotify'))return;
      if(!('Notification' in window)||Notification.permission!=='granted')return;
      const prevInv=prev.partsInventory||[];
      const nextInv=next.partsInventory||[];
      nextInv.forEach(function(p){
        if(!p.name&&!p.num)return;
        const prevPart=prevInv.find(pp=>pp.id===p.id);
        const wasAboveZero=!prevPart||(parseInt(prevPart.qty)||0)>0;
        const isNowZero=(parseInt(p.qty)||0)===0&&p.qty!=='';
        if(wasAboveZero&&isNowZero){
          try{new Notification('⚠ Out of Stock',{body:(p.name||p.num||'Part')+' is now out of stock.',tag:'zero-stock-'+p.id});}catch(e){}
        }
      });
    }

    // ── Firebase real-time sync ─────────────────────────────────────────────
    let dbRef = null;
    try {
      const app = firebase.initializeApp(firebaseConfig);
      const db  = firebase.database();
      dbRef = db.ref(DB_PATH);

      // Load from Firebase on connect
      dbRef.once('value', function(snap) {
        const remote = snap.val();
        if (remote && remote.vehicles && remote.vehicles.length > 0) {
          data = migrateInvoices(migrateCustomers(migratePhotos(remote)));
          if (!data.partsInventory) data.partsInventory = [];
          data.partsInventory = migratePartsInventoryToNewStructure(data.partsInventory);
          saveData(data);
          render();
        }
        // Subscribe to real-time updates
        dbRef.on('value', function(snap2) {
          const r2 = snap2.val();
          if (r2 && r2.vehicles) {
            const incoming = migrateInvoices(migrateCustomers(migratePhotos(r2)));
            if (JSON.stringify(incoming) !== JSON.stringify(data)) {
              data = incoming;
              if (!data.partsInventory) data.partsInventory = [];
              if (data.partsInventory.length > 0 && !data.partsInventory[0].partNumbers) {
                data.partsInventory = data.partsInventory.map(function(p) {
                  return {id: p.id, name: p.name||'', qty: p.qty||'', minQty: p.minQty||'', location: p.location||'', notes: p.notes||'', partNumbers: (p.num||p.vendor)?[{id:p.id+'_pn',num:p.num||'',vendor:p.vendor||'',unitCost:p.unitCost||'',notes:''}]:[]};
                });
              }
              saveData(data);
              render();
            }
            const dot=document.getElementById('sync-dot');
            const lbl=document.getElementById('sync-lbl');
            if(dot){dot.style.color='#16a34a';}if(lbl)lbl.textContent='Synced';
          }
        });
      });
    } catch(e) {
      console.warn('Firebase unavailable:', e.message);
    }

    // ── Initial render ──────────────────────────────────────────────────────
    render();
    setTimeout(requestNotifPermission, 2000);

    // ── Service Worker (offline support) ────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('SW registered:', r.scope))
          .catch(e => console.warn('SW registration failed:', e));
      });
    }

  </script>
</body>
</html>
