<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceLog — Fleet Maintenance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f2f5; --bg2: #ffffff; --bg3: #e8eaed; --panel: #ffffff;
      --border: #d1d5db; --border2: #b8bec8; --amber: #d97706; --amber-dim: #b45309;
      --red: #dc2626; --green: #16a34a; --text: #374151; --text-dim: #6b7280;
      --text-bright: #111827;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 15px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; max-width: 1600px; margin: 0 auto; width: 100%; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--border); flex-shrink:0; gap:12px; background:#ffffff; }
    .topbar-brand { display:flex; align-items:baseline; gap:10px; }
    .topbar-eyebrow { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:3px; color:var(--amber); text-transform:uppercase; }
    .topbar-title { font-family:'Rajdhani',sans-serif; font-size:26px; font-weight:700; color:var(--text-bright); letter-spacing:1px; line-height:1; }
    .topbar-title span { color:var(--amber); }
    .topbar-stats { display:flex; gap:20px; }
    .ts-item { text-align:center; }
    .ts-val { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; color:var(--amber); line-height:1; }
    .ts-lbl { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; }
    .layout { display:flex; flex:1; overflow:hidden; min-height:0; position:relative; }
    .sidebar { width:240px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:#f8f9fa; position:absolute; top:0; bottom:0; left:0; }
    .sidebar-hdr { padding:12px 14px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .sidebar-lbl { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
    .sidebar-list { overflow-y:auto; flex:1; padding:6px 0; min-height:0; }
    .si { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; transition:background .12s; border-left:3px solid transparent; }
    .si:hover { background:#eef0f3; }
    .si.active { background:rgba(217,119,6,.1); border-left-color:var(--amber); }
    .si-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
    .si-info { flex:1; min-width:0; }
    .si-name { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:var(--text-bright); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2; }
    .si.active .si-name { color:var(--amber); }
    .si-sub { font-size:15px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .si-count { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-dim); background:var(--bg3); padding:1px 6px; border-radius:10px; flex-shrink:0; }
    .si.active .si-count { background:rgba(217,119,6,.15); color:var(--amber); }
    .sidebar-div { height:1px; background:var(--border); margin:6px 0; }
    .sidebar-search { padding:8px 10px; flex-shrink:0; border-bottom:1px solid var(--border); }
    .sidebar-search input { width:100%; background:#ffffff; border:1px solid var(--border); border-radius:4px; padding:6px 10px; color:var(--text-bright); font-family:'Barlow',sans-serif; font-size:15px; outline:none; box-shadow:inset 0 1px 2px rgba(0,0,0,.05); }
    .sidebar-search input:focus { border-color:var(--amber); }
    .sidebar-search input::placeholder { color:var(--text-dim); }
    .sr-part { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--amber); background:rgba(245,166,35,.08); padding:2px 7px; border-radius:3px; border:1px solid rgba(245,166,35,.2); }
    .sidebar-add { margin:8px 10px 10px; padding:8px; border:1px dashed #b8bec8; border-radius:4px; background:none; color:var(--text-dim); font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:border-color .15s,color .15s; flex-shrink:0; }
    .sidebar-add:hover { border-color:var(--amber); color:var(--amber); }
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; margin-left:240px; }
    .main-content { flex:1; overflow-y:auto; padding:24px; }
    .overview-title { font-size:26px; font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:var(--text-bright); margin-bottom:4px; }
    .overview-sub { font-size:15px; color:var(--text-dim); margin-bottom:20px; }
    .summary-bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .summary-stat { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:10px 16px; flex:1; min-width:90px; }
    .summary-stat-val { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:var(--amber); line-height:1; }
    .summary-stat-lbl { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; margin-top:3px; }
    .fleet-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px; }
    .vehicle-card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:18px; cursor:pointer; transition:border-color .15s,transform .1s; position:relative; overflow:hidden; }
    .vehicle-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--amber); opacity:0; transition:opacity .15s; }
    .vehicle-card:hover { border-color:#9ca3af; transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .vehicle-card:hover::before { opacity:1; }
    .vc-type { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--amber); text-transform:uppercase; margin-bottom:5px; }
    .vc-name { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; color:var(--text-bright); margin-bottom:3px; }
    .vc-sub { font-size:15px; color:var(--text-dim); margin-bottom:12px; }
    .vc-meta { display:flex; gap:14px; flex-wrap:wrap; }
    .vc-stat { display:flex; flex-direction:column; gap:1px; }
    .vc-stat-lbl { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); font-family:'Share Tech Mono',monospace; }
    .vc-stat-val { font-size:15px; font-weight:600; color:var(--text); }
    .vc-last { margin-top:10px; font-size:15px; color:var(--text-dim); }
    .vic { background:var(--panel); border:1px solid var(--border); border-radius:6px; margin-bottom:20px; overflow:hidden; }
    .vic-top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .vic-identity { display:flex; align-items:center; gap:14px; }
    .vic-icon-wrap { width:48px; height:48px; border-radius:6px; background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.25); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
    .vic-vname { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:var(--text-bright); line-height:1; margin-bottom:3px; }
    .vic-badge { display:inline-block; font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--amber-dim); background:rgba(217,119,6,.1); padding:2px 8px; border-radius:3px; }
    .vic-actions { display:flex; gap:8px; flex-shrink:0; }
    .vic-specs { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
    .vic-spec { padding:12px 18px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
    .vic-spec:last-child { border-right:none; }
    .vic-spec-lbl { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px; }
    .vic-spec-val { font-size:15px; font-weight:600; color:var(--text-bright); font-family:'Rajdhani',sans-serif; }
    .vic-notes { padding:10px 18px; font-size:15px; color:var(--text-dim); font-style:italic; border-top:1px solid var(--border); }
    .service-list { display:flex; flex-direction:column; gap:10px; }
    .sr { background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--amber-dim); border-radius:4px; padding:14px 18px; display:grid; grid-template-columns:56px 1fr minmax(120px,180px) auto; gap:14px; align-items:start; transition:border-color .15s; }
    .sr:hover { border-left-color:var(--amber); }
    .sr-date { text-align:center; }
    .sr-day { font-family:'Rajdhani',sans-serif; font-size:24px; font-weight:700; color:var(--amber); line-height:1; }
    .sr-mon { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; color:var(--text-dim); text-transform:uppercase; }
    .sr-yr { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); }
    .sr-type { font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; color:var(--text-bright); margin-bottom:3px; }
    .sr-notes { font-size:15px; color:var(--text-dim); line-height:1.4; margin-bottom:6px; }
    .sr-partcol { display:flex; flex-direction:column; gap:6px; padding-top:2px; }
    .sr-part-row { display:flex; flex-direction:column; gap:1px; }
    .parts-list { display:flex; flex-direction:column; gap:8px; }
    .part-inv-wrap { position:relative; flex:1; }
    .part-inv-dropdown { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--border); border-top:none; border-radius:0 0 4px 4px; z-index:200; max-height:180px; overflow-y:auto; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .part-inv-option { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--bg3); display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .part-inv-option:hover { background:rgba(217,119,6,.06); }
    .part-inv-option:last-child { border-bottom:none; }
    .part-inv-opt-name { font-size:15px; font-weight:600; color:var(--text-bright); }
    .part-inv-opt-num { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--amber-dim); }
    .part-inv-opt-meta { font-size:15px; color:var(--text-dim); }
    .part-inv-opt-qty { font-family:'Share Tech Mono',monospace; font-size:15px; padding:1px 6px; border-radius:10px; }
    .part-inv-opt-qty.ok { background:rgba(22,163,74,.1); color:#16a34a; }
    .part-inv-opt-qty.low { background:rgba(217,119,6,.1); color:#d97706; }
    .part-inv-opt-qty.none { background:rgba(220,38,38,.1); color:#dc2626; }
    .part-entry { display:grid; grid-template-columns:1fr 1fr 60px 90px auto; gap:8px; align-items:center; }
    .part-cost-val { font-family:'Share Tech Mono',monospace; font-size:15px; color:#16a34a; margin-top:1px; }
    .part-entry input { background:var(--bg3); border:1px solid var(--border2); border-radius:4px; padding:7px 10px; color:var(--text-bright); font-family:'Barlow',sans-serif; font-size:15px; outline:none; transition:border-color .15s; width:100%; }
    .part-entry input:focus { border-color:var(--amber); }
    .part-remove-btn { background:rgba(220,38,38,.1); border:1px solid rgba(220,38,38,.25); color:#dc2626; border-radius:4px; padding:6px 10px; cursor:pointer; font-size:15px; line-height:1; }
    .part-price-btn { background:rgba(37,99,235,.08); border:1px solid rgba(37,99,235,.25); color:#2563eb; border-radius:4px; padding:5px 8px; cursor:pointer; font-size:15px; line-height:1; white-space:nowrap; font-family:'Share Tech Mono',monospace; }
    .part-price-btn:hover { background:rgba(37,99,235,.15); }
    .price-search-panel { position:fixed; background:#fff; border:1px solid #d1d5db; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.18); z-index:999999; padding:14px; min-width:280px; max-width:340px; }
    .price-search-title { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:#111827; margin-bottom:10px; }
    .price-search-link { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:4px; text-decoration:none; color:#374151; font-size:15px; transition:background .12s; }
    .price-search-link:hover { background:#f3f4f6; }
    .price-search-logo { width:18px; height:18px; border-radius:2px; object-fit:contain; flex-shrink:0; }
    .part-remove-btn:hover { background:rgba(220,38,38,.2); }
    .add-part-btn { background:none; border:1px dashed var(--border2); border-radius:4px; color:var(--text-dim); font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; padding:7px 12px; cursor:pointer; transition:border-color .15s,color .15s; margin-top:2px; }
    .add-part-btn:hover { border-color:var(--amber); color:var(--amber); }
    .sr-partcol-lbl { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); margin-bottom:2px; }
    .sr-partcol-val { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--amber-dim); word-break:break-word; line-height:1.4; }
    .sr-tags { display:flex; gap:6px; flex-wrap:wrap; }
    .sr-tag { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-dim); background:#e8eaed; padding:2px 7px; border-radius:3px; }
    .sr-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
    .sr-cost { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--green); }
    .empty { text-align:center; padding:60px 20px; color:var(--text-dim); }
    .empty-icon { font-size:44px; margin-bottom:12px; }
    .empty-title { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:600; margin-bottom:6px; color:var(--text); }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:4px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; letter-spacing:.5px; cursor:pointer; border:none; transition:background .15s; }
    .btn-primary { background:var(--amber); color:#0d0f12; }
    .btn-primary:hover { background:#f0b84e; }
    .btn-ghost { background:#ffffff; color:var(--text); border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,.05); }
    .btn-ghost:hover { border-color:var(--amber); color:var(--amber); }
    .btn-danger { background:rgba(232,64,42,.15); color:var(--red); border:1px solid rgba(232,64,42,.3); }
    .btn-danger:hover { background:rgba(232,64,42,.25); }
    .btn-sm { padding:4px 10px; font-size:15px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
    .modal { background:var(--bg2); border:1px solid var(--border2); border-radius:8px; width:100%; max-width:780px; max-height:92vh; overflow-y:auto; }
    .modal-hdr { padding:18px 22px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .modal-title { font-size:18px; font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:700; color:var(--text-bright); }
    .modal-close { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:20px; line-height:1; padding:4px; }
    .modal-close:hover { color:var(--text-bright); }
    .modal-body { padding:18px 22px; display:flex; flex-direction:column; gap:14px; }
    .modal-footer { padding:14px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-full { grid-column:1/-1; }
    .form-group { display:flex; flex-direction:column; gap:5px; }
    .form-lbl { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); }
    .form-input, .form-select, .form-textarea { background:var(--bg3); border:1px solid var(--border2); border-radius:4px; padding:8px 11px; color:var(--text-bright); font-family:'Barlow',sans-serif; font-size:15px; outline:none; transition:border-color .15s; width:100%; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--amber); }
    .form-select { appearance:none; cursor:pointer; }
    .form-textarea { resize:vertical; min-height:76px; }


    /* CUSTOMERS */
    .cust-item { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; transition:background .12s; border-left:3px solid transparent; }
    .cust-item:hover { background:#eef0f3; }
    .cust-item.active { background:rgba(217,119,6,.1); border-left-color:var(--amber); }
    .cust-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
    .cust-name { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:var(--text-bright); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2; flex:1; min-width:0; }
    .cust-item.active .cust-name { color:var(--amber); }
    .cust-count { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-dim); background:var(--bg3); padding:1px 6px; border-radius:10px; flex-shrink:0; }
    .cust-item.active .cust-count { background:rgba(245,166,35,.15); color:var(--amber); }
    .sidebar-section-hdr { padding:6px 14px 4px; font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-top:4px; }
    .cust-modal-actions { display:flex; gap:8px; }
    .back-cust-btn { background:none; border:none; color:var(--amber); font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; cursor:pointer; padding:0; letter-spacing:0.5px; transition:color .15s; }
    .back-cust-btn:hover { color:#f0b84e; }

    /* INVOICES */
    .inv-list { display:flex; flex-direction:column; gap:10px; }
    .inv-card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:16px 20px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; }
    .inv-card:hover { border-color:var(--border2); }
    .inv-num { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--amber-dim); font-weight:700; }
    .inv-customer { font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; color:var(--text-bright); }
    .inv-meta { font-size:15px; color:var(--text-dim); margin-top:2px; }
    .inv-status { display:inline-block; font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:3px 10px; border-radius:12px; }
    .inv-status.draft { background:rgba(107,114,128,.12); color:#6b7280; }
    .inv-status.sent  { background:rgba(217,119,6,.12); color:var(--amber-dim); }
    .inv-status.paid  { background:rgba(22,163,74,.12); color:#16a34a; }
    .inv-status.exported { background:rgba(59,130,246,.12); color:#2563eb; }
    .inv-cb { width:16px; height:16px; cursor:pointer; accent-color:var(--amber); flex-shrink:0; margin-right:4px; }
    .inv-export-bar { display:flex; align-items:center; justify-content:space-between; background:rgba(37,99,235,.07); border:1px solid rgba(37,99,235,.2); border-radius:6px; padding:10px 16px; margin-bottom:12px; }
    .inv-export-bar-msg { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; color:#2563eb; }
    .inv-total { font-family:'Share Tech Mono',monospace; font-size:18px; font-weight:700; color:var(--text-bright); text-align:right; }
    .inv-actions { display:flex; gap:6px; margin-top:8px; justify-content:flex-end; }
    .sr-cb { width:16px; height:16px; cursor:pointer; accent-color:var(--amber); flex-shrink:0; margin-top:2px; }
    .sr-invoiced-badge { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; background:rgba(22,163,74,.1); color:#16a34a; border:1px solid rgba(22,163,74,.25); padding:2px 7px; border-radius:10px; }
    .invoice-bar { display:flex; align-items:center; justify-content:space-between; background:rgba(217,119,6,.08); border:1px solid rgba(217,119,6,.2); border-radius:6px; padding:10px 16px; margin-bottom:12px; }
    .invoice-bar-msg { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; color:var(--amber-dim); }
    .labor-row { display:grid; grid-template-columns:1fr 80px 80px auto; gap:8px; align-items:center; }
    .labor-row input { background:var(--bg3); border:1px solid var(--border2); border-radius:4px; padding:7px 10px; color:var(--text-bright); font-family:'Barlow',sans-serif; font-size:15px; outline:none; width:100%; }
    .labor-row input:focus { border-color:var(--amber); }
    /* PRINT invoice */
    @media print {
      .print-invoice { display:block !important; }
      .no-print { display:none !important; }
    }
    .print-invoice { display:none; }


    /* PARTS TO ORDER */
    .po-table { width:100%; border-collapse:collapse; font-size:15px; }
    .po-table th { font-size:11px !important; font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); padding:8px 12px; text-align:left; border-bottom:2px solid var(--border); background:#f8f9fa; position:sticky; top:0; }
    .po-table td { padding:11px 13px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .po-table tr:hover td { filter: brightness(0.97); }
    .po-row-needed  { background:#fff5f5; border-left:3px solid #dc2626; }
    .po-row-ordered { background:#fffbeb; border-left:3px solid #d97706; }
    .po-row-received{ background:#f0fdf4; border-left:3px solid #16a34a; }
    .po-row-needed td:first-child  { color:#dc2626; }
    .po-row-ordered td:first-child { color:#d97706; }
    .po-row-received td:first-child{ color:#16a34a; }
    .po-status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }
    .po-status-dot.needed   { background:#dc2626; }
    .po-status-dot.ordered  { background:#d97706; }
    .po-status-dot.received { background:#16a34a; }
    .po-cb { accent-color:var(--amber); width:15px; height:15px; cursor:pointer; }
    .po-add-bar { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; padding:14px 16px; background:var(--panel); border:1px solid var(--border); border-radius:6px; }
    .po-add-bar .form-group { margin:0; flex:1; min-width:120px; }
    .po-summary { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
    .po-stat { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px 16px; min-width:90px; }
    .po-stat-val { font-family:'Share Tech Mono',monospace; font-size:20px; font-weight:700; }
    .po-stat-lbl { font-size:15px; color:var(--text-dim); margin-top:2px; }
    .po-stat.needed  .po-stat-val { color:#dc2626; }
    .po-stat.ordered .po-stat-val { color:#d97706; }
    .po-stat.received .po-stat-val { color:#16a34a; }

    /* ADMIN PANEL */
    .admin-section { background:var(--panel); border:1px solid var(--border); border-radius:6px; margin-bottom:16px; overflow:hidden; }
    .admin-section-hdr { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }

    .admin-section-desc { font-size:15px; color:var(--text-dim); margin-top:1px; }
    .admin-section-body { padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
    .admin-toggle-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--bg3); }

    .admin-toggle-label { flex:1; }
    .admin-toggle-name { font-size:15px; font-weight:600; color:var(--text-bright); }
    .admin-toggle-hint { font-size:15px; color:var(--text-dim); margin-top:2px; }
    .toggle-switch { position:relative; width:44px; height:24px; flex-shrink:0; border-radius:12px; background:#d1d5db; cursor:pointer; transition:background .2s; }
    .toggle-switch.on { background:var(--amber); }
    .toggle-switch input { opacity:0; width:0; height:0; position:absolute; }
    .toggle-slider { position:absolute; inset:0; background:#d1d5db; border-radius:24px; cursor:pointer; transition:background .2s; }
    .toggle-slider:before { content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .toggle-knob { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .toggle-switch.on .toggle-knob { transform:translateX(20px); }
    .admin-badge { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:2px 8px; border-radius:10px; }
    .admin-badge.on { background:rgba(22,163,74,.1); color:#16a34a; }
    .admin-badge.off { background:rgba(107,114,128,.1); color:#6b7280; }

    /* VENDORS */
    .vendor-card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:18px; margin-bottom:12px; }
    .vendor-card-hdr { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .vendor-name { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:var(--text-bright); }
    .vendor-meta { font-size:15px; color:var(--text-dim); margin-top:2px; display:flex; flex-wrap:wrap; gap:8px; }
    .vendor-contacts { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
    .vendor-contact { background:var(--bg3); border-radius:4px; padding:6px 10px; font-size:15px; }
    .vendor-contact-name { font-weight:600; color:var(--text-bright); }
    .vendor-contact-phone { color:var(--text-dim); }
    /* GLOBAL SEARCH */
    .gs-result { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px 16px; margin-bottom:8px; cursor:pointer; transition:border-color .12s; }
    .gs-result:hover { border-color:var(--amber); }
    .gs-source { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:2px 8px; border-radius:10px; display:inline-block; margin-bottom:6px; }
    .gs-source.fleet { background:rgba(59,130,246,.1); color:#3b82f6; }
    .gs-source.invoice { background:rgba(217,119,6,.1); color:#d97706; }
    .gs-source.order { background:rgba(220,38,38,.1); color:#dc2626; }
    .gs-source.parts { background:rgba(22,163,74,.1); color:#16a34a; }
    .gs-source.history { background:rgba(107,114,128,.1); color:#6b7280; }
    .gs-title { font-weight:600; font-size:15px; color:var(--text-bright); }
    .gs-snippet { font-size:15px; color:var(--text-dim); margin-top:2px; }
    /* ORDER HISTORY */
    .oh-vendor-group { margin-bottom:20px; }
    .oh-vendor-hdr { font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; color:var(--text-bright); padding:8px 0; border-bottom:2px solid var(--amber); margin-bottom:8px; display:flex; align-items:center; gap:8px; }

    /* CUSTOM SELECT - escapes overflow:auto scroll container */
    .cs-wrap { position:relative; }
    .cs-display { background:#fff; border:1px solid var(--border); border-radius:4px; padding:6px 28px 6px 8px; font-size:15px; color:var(--text-bright); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; font-family:'Barlow',sans-serif; }
    .cs-display::after { content:'▾'; position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:15px; color:var(--text-dim); pointer-events:none; }
    .cs-dropdown { position:fixed; background:#fff; border:1px solid var(--border); border-radius:4px; box-shadow:0 4px 16px rgba(0,0,0,.12); z-index:9999; max-height:220px; overflow-y:auto; min-width:140px; }
    .cs-search { width:100%; border:none; border-bottom:1px solid var(--border); padding:8px 10px; font-size:15px; font-family:'Barlow',sans-serif; color:var(--text-bright); outline:none; background:#fafafa; }
    .cs-search:focus { background:#fff; }
    .cs-option { padding:8px 12px; font-size:15px; color:var(--text-bright); cursor:pointer; font-family:'Barlow',sans-serif; }
    .cs-option:hover, .cs-option.active { background:rgba(217,119,6,.08); color:var(--amber-dim); }
    .cs-option.selected { font-weight:600; color:var(--amber-dim); }

    /* PIN SCREEN */
    .pin-screen { position:fixed; inset:0; background:#f0f2f5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; z-index:9999; }
    .pin-logo { font-family:'Rajdhani',sans-serif; font-size:38px; font-weight:700; color:#111827; letter-spacing:1px; }
    .pin-logo span { color:#d97706; }
    .pin-card { background:#fff; border:1px solid #d1d5db; border-radius:10px; padding:32px 36px; display:flex; flex-direction:column; align-items:center; gap:16px; box-shadow:0 4px 24px rgba(0,0,0,.07); min-width:280px; }
    .pin-title { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; color:#374151; }
    .pin-dots { display:flex; gap:12px; margin:4px 0; }
    .pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid #d1d5db; background:transparent; transition:all .15s; }
    .pin-dot.filled { background:#d97706; border-color:#d97706; }
    .pin-keypad { display:grid; grid-template-columns:repeat(3,64px); gap:10px; }
    .pin-key { width:64px; height:64px; border-radius:50%; border:1px solid #d1d5db; background:#fff; font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:#111827; cursor:pointer; transition:all .12s; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .pin-key:hover { background:#f9fafb; border-color:#b8bec8; }
    .pin-key:active { background:#f3f4f6; transform:scale(.95); }
    .pin-key.del { font-size:16px; color:#6b7280; }
    .pin-error { color:#dc2626; font-size:15px; font-family:'Share Tech Mono',monospace; min-height:18px; }
    .pin-hint { font-size:15px; color:#9ca3af; text-align:center; }

    /* VEHICLE TO-DO LIST */
    .todo-section { border-top:1px solid var(--border); }
    .todo-hdr { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; cursor:pointer; user-select:none; }
    .todo-hdr-title { font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; color:var(--text-bright); display:flex; align-items:center; gap:8px; }
    .todo-badge { font-family:'Share Tech Mono',monospace; font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(220,38,38,.1); color:#dc2626; }
    .todo-badge.done { background:rgba(22,163,74,.1); color:#16a34a; }
    .todo-list { padding:0 18px 14px; display:flex; flex-direction:column; gap:6px; }
    .todo-item { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:var(--bg3); border-radius:6px; border-left:3px solid #dc2626; }
    .todo-item.done { border-left-color:#16a34a; opacity:.7; }
    .todo-cb { width:17px; height:17px; cursor:pointer; accent-color:#16a34a; flex-shrink:0; margin-top:2px; }
    .todo-text { flex:1; font-size:15px; color:var(--text-bright); line-height:1.4; }
    .todo-item.done .todo-text { text-decoration:line-through; color:var(--text-dim); }
    .todo-meta { font-size:12px; color:var(--text-dim); margin-top:2px; }
    .todo-priority { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px; padding:1px 6px; border-radius:3px; flex-shrink:0; margin-top:3px; }
    .todo-priority.high { background:rgba(220,38,38,.12); color:#dc2626; }
    .todo-priority.medium { background:rgba(217,119,6,.12); color:#d97706; }
    .todo-priority.low { background:rgba(22,163,74,.12); color:#16a34a; }
    .todo-add-row { display:flex; gap:8px; padding:8px 18px 14px; }
    /* REPORT */
    .report-bar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:flex-end; }
    .report-field { display:flex; flex-direction:column; gap:5px; flex:1; min-width:140px; }
    .report-field label { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); }
    .report-field input, .report-field select { background:#ffffff; border:1px solid var(--border); border-radius:4px; padding:8px 11px; color:var(--text-bright); font-family:'Barlow',sans-serif; font-size:15px; outline:none; transition:border-color .15s; width:100%; box-shadow:inset 0 1px 2px rgba(0,0,0,.04); }
    .report-field input:focus, .report-field select:focus { border-color:var(--amber); }
    .report-field select { appearance:none; cursor:pointer; }
    .report-clear { background:var(--bg3); color:var(--text-dim); border:1px solid var(--border2); border-radius:4px; padding:8px 14px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; cursor:pointer; align-self:flex-end; white-space:nowrap; }
    .report-clear:hover { border-color:var(--amber); color:var(--amber); }
    .report-summary { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .report-stat { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:8px 14px; }
    .report-stat-val { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:var(--amber); line-height:1; }
    .report-stat-lbl { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; margin-top:3px; }
    .report-table { width:100%; border-collapse:collapse; font-size:15px; }
    .report-table th { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); padding:8px 12px; text-align:left; border-bottom:2px solid var(--border); background:#f8f9fa; position:sticky; top:0; }
    .report-table td { padding:10px 12px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:top; }
    .report-table tr:hover td { background:rgba(255,255,255,.02); }
    .report-table .td-vehicle { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:var(--text-bright); cursor:pointer; }
    .report-table .td-vehicle:hover { color:var(--amber); }
    .report-table .td-date { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--text-dim); white-space:nowrap; }
    .report-table .td-type { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--amber); }
    .report-table .td-part { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--amber); }
    .report-table .td-cost { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--green); text-align:right; }
    .report-table .td-notes { font-size:15px; color:var(--text-dim); max-width:320px; }
    .tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:0; flex-shrink:0; background:#ffffff; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab-btn { padding:10px 20px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; color:var(--text-dim); cursor:pointer; border:none; background:none; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s, border-color .15s; }
    .tab-btn:hover { color:var(--text); }
    .tab-btn.active { color:var(--amber); border-bottom-color:var(--amber); }
    .report-empty { text-align:center; padding:60px 20px; color:var(--text-dim); }
    ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:#e8eaed; } ::-webkit-scrollbar-thumb { background:#b8bec8; border-radius:3px; }
    /* PHOTO */
    .si-thumb { width:32px; height:32px; border-radius:4px; object-fit:cover; flex-shrink:0; border:1px solid var(--border2); }
    .si.active .si-thumb { border-color:var(--amber); }
    .si-icon { font-size:15px; width:32px; height:32px; text-align:center; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .vc-photo { width:100%; height:120px; object-fit:cover; display:block; }
    .vc-photo-placeholder { width:100%; height:80px; background:#e8eaed; display:flex; align-items:center; justify-content:center; font-size:28px; }
    .vc-body { padding:14px 18px 18px; }
    .vic-photo-banner { width:100%; max-height:420px; object-fit:contain; display:block; background:#e8eaed; }
    .vic-photo-placeholder { width:100%; height:80px; background:#e8eaed; display:flex; align-items:center; justify-content:center; font-size:36px; }
    .vic-icon-wrap img { width:100%; height:100%; object-fit:cover; border-radius:6px; }
    .photo-upload-area { border:2px dashed #b8bec8; border-radius:6px; padding:20px; text-align:center; cursor:pointer; transition:border-color .15s; position:relative; background:#f8f9fa; }
    .photo-upload-area:hover { border-color:var(--amber); }
    .photo-upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .photo-preview { width:100%; height:160px; object-fit:cover; border-radius:4px; display:block; margin-bottom:8px; }
    .photo-upload-lbl { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); }
    .photo-remove { background:rgba(232,64,42,.15); color:var(--red); border:1px solid rgba(232,64,42,.3); border-radius:4px; padding:4px 10px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; }


    .sync-dot { width:8px; height:8px; border-radius:50%; background:#16a34a; display:inline-block; margin-left:8px; flex-shrink:0; }
    .sync-dot.syncing { background:#d97706; animation:pulse 1s infinite; }
    .sync-dot.error { background:#dc2626; }
    .sync-dot.offline { background:#9ca3af; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .sync-label { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; color:var(--text-dim); }
    .loading-screen { position:fixed; inset:0; background:#f0f2f5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:999; }
    .loading-screen .logo { font-family:'Rajdhani',sans-serif; font-size:32px; font-weight:700; color:#111827; }
    .loading-screen .logo span { color:#d97706; }
    .loading-spinner { width:32px; height:32px; border:3px solid #d1d5db; border-top-color:#d97706; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-sub { font-family:'Share Tech Mono',monospace; font-size:15px; letter-spacing:2px; color:#6b7280; text-transform:uppercase; }
    @media print {
      .topbar, .tab-bar, .sidebar, .report-bar, .report-clear, .no-print { display:none !important; }
      body { background:#fff !important; color:#000 !important; }
      .main { overflow:visible !important; }
      .main-content { padding:0 !important; overflow:visible !important; }
      .layout { display:block !important; }
      .report-summary { margin-bottom:14px; }
      .report-stat { background:#f5f5f5 !important; border:1px solid #ddd !important; }
      .report-stat-val { color:#c47e0e !important; }
      .report-stat-lbl { color:#666 !important; }
      .report-table th { background:#f0f0f0 !important; color:#444 !important; border-bottom:2px solid #ccc !important; }
      .report-table td { border-bottom:1px solid #eee !important; color:#222 !important; }
      .report-table .td-vehicle { color:#000 !important; }
      .report-table .td-type { color:#c47e0e !important; }
      .report-table .td-part { color:#c47e0e !important; }
      .report-table .td-cost { color:#2a7a4b !important; }
      .report-table .td-notes { color:#555 !important; }
      .print-header { display:block !important; }
      @page { margin:1.5cm; }
    }
    .print-header { display:none; margin-bottom:16px; }
    .print-header h1 { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:#000; }
    .print-header p { font-size:15px; color:#555; margin-top:4px; }
    @media (max-width:640px) { .sidebar { width:200px; } .topbar-stats { display:none; } .sr { grid-template-columns:1fr auto; } .sr-date { display:none; } .sr-partcol { display:none; } .form-row { grid-template-columns:1fr; } }
    @media (max-width:480px) { .sidebar { display:none; } .main-content { padding:16px; } }

<body>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <div id="app"></div>
  <input type="file" id="global-photo-input" accept="image/*" style="display:none" />
  <script>
    const ICONS = {Truck:"🚛",Tractor:"🚜",Combine:"🌾","Grain Cart":"⚙",Semi:"🚛",Trailer:"📦",Sprayer:"💧",Pickup:"🛻","ATV/UTV":"🏎",Generator:"⚡",Other:"🔧"};
    const SERVICE_TYPES = ["Oil Change","Filter Replacement","Tire Service","Brake Service","Hydraulic Service","Belt/Chain Replacement","Coolant Service","Fuel System","Battery/Electrical","Inspection","Repair","Other"];
    const EQUIPMENT_TYPES = ["Truck","Tractor","Combine","Grain Cart","Semi","Trailer","Sprayer","Pickup","ATV/UTV","Generator","Other"];
    const STORAGE_KEY = "svc_tracker_v1";

    const PIN_KEY = 'svc_pin_v1';
    const SESSION_KEY = 'svc_unlocked_v1';
    let pinEntry = '';
    let pinError = '';

    function getPin() {
      return localStorage.getItem(PIN_KEY) || '';
    }
    function isUnlocked() {
      return !getPin() || sessionStorage.getItem(SESSION_KEY) === '1';
    }
    function unlock() {
      sessionStorage.setItem(SESSION_KEY, '1');
    }
    function lock() {
      sessionStorage.removeItem(SESSION_KEY);
    }

    function renderPinScreen(mode) {
      // mode: 'enter' | 'set' | 'confirm'
      const digits = pinEntry.length;
      const maxLen = 6;
      const dots = Array.from({length:maxLen}, (_,i) =>
        `<div class="pin-dot${i < digits ? ' filled' : ''}"></div>`
      ).join('');

      const titles = {enter:'Enter PIN', set:'Set a new PIN', confirm:'Confirm PIN'};
      const hints  = {enter:'', set:'Choose a 4–6 digit PIN', confirm:'Enter PIN again to confirm'};

      return `<div class="pin-screen" id="pin-screen">
        <div class="pin-logo">SERVICE<span>LOG</span></div>
        <div class="pin-card">
          <div class="pin-title">${titles[mode]||'Enter PIN'}</div>
          <div class="pin-dots">${dots}</div>

    function compressImage(file, maxW, maxH, quality) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          let w=img.width, h=img.height;
          if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
          if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
          const canvas=document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg',quality));
        };
        img.src=url;
      });
    }

    function getPartsArray(r) {
      if (r.parts && Array.isArray(r.parts) && r.parts.length > 0) return r.parts;

      // legacy: split from notes
      const raw = r.notes || '';
      const idx = raw.indexOf(' | Parts:');
      if (idx !== -1) return [{desc:'', num: raw.slice(idx + 9).trim()}];
      return [];
    }
    function getCleanNotes(r) {
      if (r.parts) return r.notes||'';
      if (r.partnum) return r.notes||'';
      const raw = r.notes||'';
      const idx = raw.indexOf(' | Parts:');
      return idx === -1 ? raw : raw.slice(0, idx).trim();
    }

      const parts = getPartsArray(r);

              <div class="sr-right">

                <button class="btn btn-ghost btn-sm no-print" data-action="edit-record" data-id="${esc(r.id)}">Edit</button>

      const photo = v.photo||null;

        <div class="vic">
          ${photo ? `<img class="vic-photo-banner" src="${photo}" alt="${esc(v.name)}" />` : `<div class="vic-photo-placeholder">${ICONS[v.type]||'🔧'}</div>`}
          ${(v.year||v.make||v.model||v.engine||v.hp) ? `<div style="display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--border)">
            ${v.year?`<div style="padding:8px 16px;border-right:1px solid var(--border)"><div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px">Year</div><div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--text-bright)">${esc(v.year)}</div></div>`:''}
            ${v.make?`<div style="padding:8px 16px;border-right:1px solid var(--border)"><div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px">Make</div><div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--text-bright)">${esc(v.make)}</div></div>`:''}
            ${v.model?`<div style="padding:8px 16px;border-right:1px solid var(--border)"><div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px">Model</div><div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--text-bright)">${esc(v.model)}</div></div>`:''}
            ${v.engine?`<div style="padding:8px 16px;border-right:1px solid var(--border);flex:1"><div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px">Engine</div><div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--text-bright)">${esc(v.engine)}</div></div>`:''}
            ${v.hp?`<div style="padding:8px 16px"><div style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px">HP</div><div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--text-bright)">${esc(String(v.hp))}</div></div>`:''}
          </div>` : ''}
          <div class="vic-top">
            <div class="vic-identity">
              <div class="vic-icon-wrap">${photo ? `<img src="${photo}" alt="" />` : (ICONS[v.type]||'🔧')}</div>
              <div><div class="vic-vname">${esc(v.name)}</div><span class="vic-badge">${esc(v.type)}</span></div>
            </div>

              <button class="btn btn-ghost btn-sm no-print" data-action="print-service-history" data-id="${esc(v.id)}">🖨 Print History</button>

          <div class="vic-specs">${specs}</div>

          const done=todos.filter(t=>t.done).length;
          const isOpen=window['_todoOpen_'+v.id]!==false;

    function renderCostAnalysis() {
      const vehicles = data.vehicles || [];
      const records  = data.records  || [];
      const customers = data.customers || [];

      // Build cost per vehicle
      const vCosts = vehicles.map(v => {
        const vRecs = records.filter(r => r.vehicleId === v.id);
        const total = vRecs.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
        const cust  = customers.find(c=>c.id===v.customerId);
        return { v, recs:vRecs, total, cust };
      }).filter(vc => vc.recs.length > 0 || vc.total > 0)
        .sort((a,b) => b.total - a.total);

      const grandTotal = vCosts.reduce((s,vc)=>s+vc.total, 0);
      const maxCost    = vCosts[0]?.total || 1;

      // Cost by customer
      const custCosts = {};
      vCosts.forEach(vc => {
        const cn = vc.cust?.name || 'Unassigned';
        if (!custCosts[cn]) custCosts[cn] = 0;
        custCosts[cn] += vc.total;
      });
      const custEntries = Object.entries(custCosts).sort((a,b)=>b[1]-a[1]);

      // Cost by service type
      const typeCosts = {};
      records.forEach(r => {
        const t = r.type || 'Other';
        if (!typeCosts[t]) typeCosts[t] = 0;
        typeCosts[t] += parseFloat(r.cost)||0;
      });
      const typeEntries = Object.entries(typeCosts).sort((a,b)=>b[1]-a[1]).slice(0,8);

      // Year over year totals
      const yearCosts = {};
      records.forEach(r => {
        const y = (r.date||'').slice(0,4);
        if (!y || y < '2010') return;
        if (!yearCosts[y]) yearCosts[y] = 0;
        yearCosts[y] += parseFloat(r.cost)||0;
      });
      const yearEntries = Object.entries(yearCosts).sort((a,b)=>a[0].localeCompare(b[0]));
      const maxYear = yearEntries.reduce((m,e)=>Math.max(m,e[1]),1);

      const barColor = (pct) => pct > 0.66 ? '#dc2626' : pct > 0.33 ? '#d97706' : '#16a34a';

      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
          <div>
            <div class="overview-title">Maintenance Cost Analysis</div>
            <div class="overview-sub">${vCosts.length} equipment tracked · Total: <strong>$${grandTotal.toLocaleString(undefined,{minimumFractionDigits:2})}</strong></div>
          </div>
        </div>

        <!-- Summary stats -->
        <div class="summary-bar" style="margin-bottom:20px">
          <div class="summary-stat"><div class="summary-stat-val">${vCosts.length}</div><div class="summary-stat-lbl">Equipment w/ Records</div></div>
          <div class="summary-stat"><div class="summary-stat-val">$${grandTotal>0?(grandTotal/vCosts.length).toLocaleString(undefined,{maximumFractionDigits:0}):'0'}</div><div class="summary-stat-lbl">Avg Cost / Unit</div></div>
          <div class="summary-stat"><div class="summary-stat-val">$${vCosts[0]?vCosts[0].total.toLocaleString(undefined,{maximumFractionDigits:0}):'0'}</div><div class="summary-stat-lbl">Most Expensive Unit</div></div>
          <div class="summary-stat"><div class="summary-stat-val">${records.length}</div><div class="summary-stat-lbl">Total Service Records</div></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">

          <!-- Cost by service type -->
          <div style="background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px">
            <div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;margin-bottom:12px">Cost by Service Type</div>
            ${typeEntries.map(([t,cost])=>{
              const pct = cost/(typeEntries[0]?.[1]||1);
              return `<div style="margin-bottom:8px">
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
                  <span style="color:var(--text-dim)">${esc(t)}</span>
                  <span style="font-family:'Share Tech Mono',monospace;font-weight:700">$${cost.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
                </div>
                <div style="height:6px;background:var(--bg3);border-radius:3px"><div style="height:100%;width:${(pct*100).toFixed(1)}%;background:${barColor(pct)};border-radius:3px;transition:width .3s"></div></div>
              </div>`;
            }).join('')}
          </div>

          <!-- Year over year -->
          <div style="background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px">
            <div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;margin-bottom:12px">Cost by Year</div>
            ${yearEntries.length===0?'<div style="color:var(--text-dim);font-size:13px">No dated records with costs yet.</div>':
              yearEntries.map(([y,cost])=>{
                const pct = cost/maxYear;
                return `<div style="margin-bottom:8px">
                  <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
                    <span style="font-family:'Share Tech Mono',monospace;color:var(--text-dim)">${y}</span>
                    <span style="font-family:'Share Tech Mono',monospace;font-weight:700">$${cost.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
                  </div>
                  <div style="height:6px;background:var(--bg3);border-radius:3px"><div style="height:100%;width:${(pct*100).toFixed(1)}%;background:#2563eb;border-radius:3px"></div></div>
                </div>`;
              }).join('')}
          </div>
        </div>

        <!-- Equipment ranking -->
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:16px">
          <div style="font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;margin-bottom:12px">Equipment Ranked by Total Maintenance Cost</div>
          <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <thead><tr style="border-bottom:2px solid var(--border)">
                <th style="text-align:left;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">#</th>
                <th style="text-align:left;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">Equipment</th>
                <th style="text-align:left;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">Customer</th>
                <th style="text-align:center;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">Records</th>
                <th style="text-align:right;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">Total Cost</th>
                <th style="padding:6px 10px;width:160px"></th>
              </tr></thead>
              <tbody>
                ${vCosts.map((vc,idx)=>{
                  const pct = vc.total/maxCost;
                  const rank = idx+1;
                  const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
                  return `<tr style="border-bottom:1px solid var(--border);cursor:pointer" data-action="select" data-id="${esc(vc.v.id)}" onclick="appView='fleet';selectedId='${vc.v.id}';selectedCustomerId='${vc.v.customerId}';render()">
                    <td style="padding:8px 10px;font-family:'Share Tech Mono',monospace;color:var(--text-dim)">${medal||rank}</td>
                    <td style="padding:8px 10px">
                      <div style="font-weight:600">${esc(vc.v.name)}</div>
                      <div style="font-size:11px;color:var(--text-dim)">${[vc.v.year,vc.v.make,vc.v.model].filter(Boolean).join(' ')}</div>
                    </td>
                    <td style="padding:8px 10px;font-size:12px;color:var(--text-dim)">${esc(vc.cust?.name||'')}</td>
                    <td style="padding:8px 10px;text-align:center;font-family:'Share Tech Mono',monospace">${vc.recs.length}</td>
                    <td style="padding:8px 10px;text-align:right;font-family:'Share Tech Mono',monospace;font-weight:700;color:${pct>0.66?'#dc2626':pct>0.33?'#d97706':'#374151'}">$${vc.total.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
                    <td style="padding:8px 10px">
                      <div style="height:8px;background:var(--bg3);border-radius:4px"><div style="height:100%;width:${(pct*100).toFixed(1)}%;background:${barColor(pct)};border-radius:4px"></div></div>
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

            <div class="overview-sub">${invoices.length} invoice${invoices.length!==1?'s':''} total
              ${invoices.filter(i=>i.qbExported).length>0?` · <span style="color:#2563eb">${invoices.filter(i=>i.qbExported).length} exported to QB</span>`:''}

          </div>
        </div>
        ${invoices.length===0

          : `<div class="inv-list">${invoices.map(inv=>{
              const cust = customers.find(c=>c.id===inv.customerId);
              const checked = selectedInvoiceIds.has(inv.id);
              return `<div class="inv-card${checked?' ':''}" style="${checked?'border-color:rgba(37,99,235,.4);background:rgba(37,99,235,.03)':''}">

                  ${qbReady?`<input type="checkbox" class="inv-cb" data-action="toggle-invoice-sel" data-id="${esc(inv.id)}" ${checked?'checked':''} style="margin-top:4px" />`:''}
                  <div style="flex:1">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
                      <span class="inv-num">${esc(inv.num)}</span>
                      <span class="inv-status ${STATUS_COLORS[inv.status]||'draft'}">${inv.status||'Draft'}</span>
                      ${inv.qbExported?`<span class="inv-status exported">✓ In QB${inv.qbExportedDate?' · '+inv.qbExportedDate:''}</span>`:''}
                    </div>
                    <div class="inv-customer">${esc(cust?.name||'Unknown Customer')}</div>
                    <div class="inv-meta">${esc(inv.date)} · ${inv.lineItems?.length||0} service record${(inv.lineItems?.length||0)!==1?'s':''}</div>
                    ${inv.notes?`<div class="inv-meta" style="margin-top:4px;font-style:italic">${esc(inv.notes)}</div>`:''}

    function renderPartsTable() {
      const allParts = (data.partsToOrder || []).slice().reverse();
      const pf = poFilters;
      const parts = allParts.filter(p=>{
        const q = pf.q.toLowerCase();
        if (q && !(p.desc+p.num+p.vendor+(p.notes||'')).toLowerCase().includes(q)) return false;
        if (pf.vendor && (p.vendor||'').toLowerCase() !== pf.vendor.toLowerCase()) return false;
        if (pf.num && (p.num||'').toLowerCase() !== pf.num.toLowerCase()) return false;
        if (pf.vehicle) {
          if (pf.vehicle === '__stock__') { if (p.vehicleId !== '__stock__') return false; }
          else if (p.vehicleId !== pf.vehicle) return false;
        }
        if (pf.status === 'needed'   && (p.ordered||p.received)) return false;
        if (pf.status === 'ordered'  && (!p.ordered||p.received)) return false;
        if (pf.status === 'received' && !p.received) return false;
        return true;
      });
      const activeFilters = Object.values(poFilters).filter(Boolean).length;
      const needed   = parts.filter(p=>!p.ordered && !p.received).length;
      const ordered  = parts.filter(p=>p.ordered && !p.received).length;
      const received = parts.filter(p=>p.received).length;
      const vendors = [...new Set(allParts.map(p=>p.vendor).filter(Boolean))].sort();
      return `        <div class="po-summary" style="margin-top:0">
          <div class="po-stat needed"><div class="po-stat-val">${needed}</div><div class="po-stat-lbl">To Order</div></div>
          <div class="po-stat ordered"><div class="po-stat-val">${ordered}</div><div class="po-stat-lbl">Ordered</div></div>
          <div class="po-stat received"><div class="po-stat-val">${received}</div><div class="po-stat-lbl">Received</div></div>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:6px;align-items:flex-end">

                <input class="cs-search" placeholder="Type to search..." data-cs-search="po-vendor" />
                <div class="cs-option${!pf.vendor?' selected':''}" data-action="cs-pick" data-cs="po-vendor" data-field="vendor" data-val="">All Vendors</div>
                ${vendors.map(v=>`<div class="cs-option${pf.vendor===v?' selected':''}" data-action="cs-pick" data-cs="po-vendor" data-field="vendor" data-val="${esc(v)}">${esc(v)}</div>`).join('')}
              </div>
            </div>
          </div>
          <div style="min-width:120px;flex:1">
            <label class="form-lbl" style="margin-bottom:3px;display:block">Part #</label>
            <div class="cs-wrap" data-cs="po-num">
              <div class="cs-display" data-action="cs-open" data-cs="po-num">${pf.num||'All Part #s'}</div>
              <div class="cs-dropdown" id="cs-po-num" style="display:none">
                <input class="cs-search" placeholder="Type to search..." data-cs-search="po-num" />
                <div class="cs-option${!pf.num?' selected':''}" data-action="cs-pick" data-cs="po-num" data-field="num" data-val="">All Part #s</div>
                ${[...new Set(allParts.map(p=>p.num).filter(Boolean))].sort().map(n=>`<div class="cs-option${pf.num===n?' selected':''}" data-action="cs-pick" data-cs="po-num" data-field="num" data-val="${esc(n)}">${esc(n)}</div>`).join('')}
              </div>
            </div>
          </div>
          <div style="min-width:120px;flex:1">
            <label class="form-lbl" style="margin-bottom:3px;display:block">Status</label>
            <div class="cs-wrap" data-cs="po-status">
              <div class="cs-display" data-action="cs-open" data-cs="po-status">${{'':'All Status','needed':'To Order','ordered':'Ordered','received':'Received'}[pf.status]||'All Status'}</div>
              <div class="cs-dropdown" id="cs-po-status" style="display:none">
                ${[['','All Status'],['needed','To Order'],['ordered','Ordered'],['received','Received']].map(([v,l])=>`<div class="cs-option${pf.status===v?' selected':''}" data-action="cs-pick" data-cs="po-status" data-field="status" data-val="${v}">${l}</div>`).join('')}
              </div>
            </div>
          </div>
          <div style="min-width:160px;flex:2">
            <label class="form-lbl" style="margin-bottom:3px;display:block">Vehicle</label>
            <div class="cs-wrap" data-cs="po-vehicle">
              <div class="cs-display" data-action="cs-open" data-cs="po-vehicle">${pf.vehicle===''?'All Vehicles':pf.vehicle==='__stock__'?'📦 For Stock':((data.vehicles||[]).find(v=>v.id===pf.vehicle)||{}).name||'All Vehicles'}</div>

                ${(data.vehicles||[]).filter(v=>allParts.some(p=>p.vehicleId===v.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(v=>`<div class="cs-option${pf.vehicle===v.id?' selected':''}" data-action="cs-pick" data-cs="po-vehicle" data-field="vehicle" data-val="${esc(v.id)}">${esc(v.name)}</div>`).join('')}
              </div>
            </div>
          </div>
          <div style="display:flex;align-items:flex-end">

          </div>
        </div>

        <div class="po-add-bar">

            <input id="po-vendor" class="form-input" list="vendor-list-po" placeholder="Select or type vendor..." />
            <datalist id="vendor-list-po">${(data.vendors||[]).sort((a,b)=>a.name.localeCompare(b.name)).map(v=>`<option value="${esc(v.name)}"></option>`).join('')}</datalist>
          </div>
          <div class="form-group" style="flex:2"><label class="form-lbl">Part Description</label>
            <input id="po-desc" class="form-input" list="inv-desc-list-po" placeholder="e.g. Oil filter..." autocomplete="off" />
            <datalist id="inv-desc-list-po">${(data.partsInventory||[]).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist>
          </div>
          <div class="form-group"><label class="form-lbl">Part #</label>
            <input id="po-num" class="form-input" list="inv-num-list-po" placeholder="e.g. 1792XE" autocomplete="off" />
            <datalist id="inv-num-list-po">${(data.partsInventory||[]).flatMap(p=>(p.partNumbers||[]).filter(n=>n.num).map(n=>({name:p.name,num:n.num}))).sort((a,b)=>a.num.localeCompare(b.num)).map(p=>`<option value="${esc(p.num)}">${esc(p.name)}</option>`).join('')}</datalist>

          </div>

        </div>

        ${parts.length===0
          ? `<div class="empty"><div class="empty-icon">🔩</div><div class="empty-title">No Parts Listed</div><div style="font-size:14px">Add parts above to start tracking orders.</div></div>`

            <table class="po-table">
              <thead><tr>
                <th style="width:28px"></th>
                <th>Vendor</th>
                <th>Description</th>
                <th>Part #</th>
                <th style="text-align:center">Qty</th>
                <th>Vehicle</th>
                <th>Unit Cost</th>
                <th style="text-align:center">Ordered</th>
                <th style="text-align:center">Received</th>
                <th style="width:40px"></th>

                ${parts.map(p=>{
                  const rowClass = p.received ? 'po-row-received' : p.ordered ? 'po-row-ordered' : 'po-row-needed';
                  const dotClass = p.received ? 'received' : p.ordered ? 'ordered' : 'needed';
                  const veh = p.vehicleId === '__stock__' ? {name:'📦 For Stock'} : (p.vehicleId ? (data.vehicles||[]).find(v=>v.id===p.vehicleId) : null);
                  return `<tr class="${rowClass}">
                    <td><span class="po-status-dot ${dotClass}"></span></td>
                    <td><input type="checkbox" class="po-cb" data-action="po-toggle-sel" data-id="${esc(p.id)}" ${selectedOrderPartIds.has(p.id)?"checked":""} style="accent-color:var(--amber);cursor:pointer;width:15px;height:15px" /></td>

    function renderPartsInventory() {
      const inv = (data.partsInventory || []);
      const invF = window._invFilters || {q:'',vendor:'',location:'',vehicle:''};
      const activeInvFilters = Object.values(invF).filter(Boolean).length;

      const filtered = inv.filter(p=>{
        if(invF.q) {
          const vNames=(p.vehicleIds||[]).map(vid=>{const v=(data.vehicles||[]).find(v=>v.id===vid);return v?v.name+' '+v.make+' '+v.model:''}).join(' ');
          if(!(p.name+(p.notes||'')+(p.partNumbers||[]).map(n=>n.num+n.vendor).join(' ')+vNames).toLowerCase().includes(invF.q.toLowerCase())) return false;
        }
        if(invF.vendor && !(p.partNumbers||[]).some(n=>(n.vendor||'').toLowerCase()===invF.vendor.toLowerCase())) return false;
        if(invF.location && (p.location||'').toLowerCase()!==(invF.location||'').toLowerCase()) return false;
        if(invF.vehicle && !(p.vehicleIds||[]).includes(invF.vehicle)) return false;
        return true;
      }).sort((a,b)=>a.name.localeCompare(b.name));

      const lowStock = inv.filter(p=>p.qty!==''&&p.minQty!==''&&Number(p.qty)<=Number(p.minQty)).length;
      const allVendors = [...new Set(inv.flatMap(p=>(p.partNumbers||[]).map(n=>n.vendor).filter(Boolean)))].sort();
      const allLocs = [...new Set(inv.map(p=>p.location).filter(Boolean))].sort();

      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">

            <div class="overview-title">Parts Inventory</div>
            <div class="overview-sub">${inv.length} item${inv.length!==1?'s':''}${lowStock>0?` · <span style="color:#dc2626;font-weight:600">${lowStock} low stock</span>`:''}
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            ${activeInvFilters?`<button class="btn btn-ghost btn-sm" data-action="inv-clear-filters">✕ Clear</button>`:''}
${(()=>{ const names=[...new Set((data.partsInventory||[]).map(p=>(p.name||"").trim().toLowerCase()))].filter(n=>n&&(data.partsInventory||[]).filter(p=>(p.name||"").trim().toLowerCase()===n).length>1); return names.length?`<button class="btn btn-ghost btn-sm" style="border-color:#d97706;color:#d97706" data-action="inv-find-dupes">⚠ ${names.length} Duplicate${names.length>1?"s":""}</button>`:""; })()}

        </div>

        <!-- Filter bar -->

            <label class="form-lbl" style="margin-bottom:3px;display:block">Search</label>

          </div>
          <div style="min-width:130px;flex:1">
            <label class="form-lbl" style="margin-bottom:3px;display:block">Vendor</label>

              <div class="cs-display" data-action="cs-open" data-cs="inv-vendor">${invF.vendor||'All Vendors'}</div>

                <input class="cs-search" placeholder="Type to search..." data-cs-search="inv-vendor" />

                ${allVendors.map(v=>`<div class="cs-option${invF.vendor===v?' selected':''}" data-action="cs-inv-pick" data-field="vendor" data-val="${esc(v)}">${esc(v)}</div>`).join('')}

          </div>
          <div style="min-width:140px;flex:1">
            <label class="form-lbl" style="margin-bottom:3px;display:block">Location</label>
            <div class="cs-wrap" data-cs="inv-location">
              <div class="cs-display" data-action="cs-open" data-cs="inv-location">${invF.location||'All Locations'}</div>

                <input class="cs-search" placeholder="Type to search..." data-cs-search="inv-location" />

                ${allLocs.map(l=>`<div class="cs-option${invF.location===l?' selected':''}" data-action="cs-inv-pick" data-field="location" data-val="${esc(l)}">${esc(l)}</div>`).join('')}
              </div>
            </div>
          </div>
        </div>

        ${filtered.length===0
          ? `<div class="empty"><div class="empty-icon">📦</div><div class="empty-title">${inv.length===0?'No Items Yet':'No Results'}</div></div>`

              const none = p.qty!==''&&Number(p.qty)===0;
              const borderColor = none?'#dc2626':low?'#d97706':'#16a34a';
              const qtyColor    = none?'#dc2626':low?'#d97706':'#111827';

              return `<div style="background:var(--panel);border:1px solid var(--border);border-left:3px solid ${borderColor};border-radius:6px;margin-bottom:10px">

                <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap">
                  <div style="flex:1;min-width:0">
                    <div style="font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--text-bright)">${esc(p.name)}</div>
                    ${p.location?`<div style="font-size:13px;color:var(--text-dim)">📍 ${esc(p.location)}</div>`:''}
                    ${(p.vehicleIds||[]).length>0?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${(p.vehicleIds||[]).map(vid=>{const v=(data.vehicles||[]).find(v=>v.id===vid);return v?'<span style="font-size:11px;font-family:Share Tech Mono,monospace;background:rgba(217,119,6,.1);color:#b45309;padding:2px 7px;border-radius:10px">'+esc(v.name)+'</span>':''}).join('')}</div>`:''}

                  <!-- Qty controls -->
                  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                    <button style="background:none;border:1px solid var(--border);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center" data-action="inv-qty-dec" data-id="${esc(p.id)}">−</button>
                    <div style="text-align:center;min-width:40px">
                      <div style="font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:${qtyColor};line-height:1">${p.qty!==''?p.qty:'—'}</div>

                    </div>
                    <button style="background:none;border:1px solid var(--border);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center" data-action="inv-qty-inc" data-id="${esc(p.id)}">+</button>

                  <!-- Actions -->

                    <button class="btn btn-ghost btn-sm" data-action="add-part-num" data-id="${esc(p.id)}">+ Part #</button>
                    <button class="btn btn-ghost btn-sm" data-action="edit-inv-item" data-id="${esc(p.id)}">Edit</button>

                  </div>

                <!-- Part numbers table -->
                ${pns.length>0?`<div style="border-top:1px solid var(--border);overflow-x:auto">
                  <table style="width:100%;border-collapse:collapse;font-size:14px">
                    <thead><tr style="background:var(--bg3)">
                      <th style="text-align:left;padding:7px 14px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">VENDOR</th>
                      <th style="text-align:left;padding:7px 14px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">PART #</th>
                      <th style="text-align:right;padding:7px 14px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">UNIT COST</th>
                      <th style="text-align:left;padding:7px 14px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-dim)">NOTES</th>
                      <th style="width:80px"></th>
                    </tr></thead>
                    <tbody>
                      ${pns.map(n=>`<tr style="border-top:1px solid var(--border)">
                        <td style="padding:8px 14px;font-weight:600">${esc(n.vendor||'')}</td>
                        <td style="padding:8px 14px;font-family:'Share Tech Mono',monospace;color:var(--amber-dim)">${esc(n.num||'')}</td>
                        <td style="padding:8px 14px;text-align:right;font-family:'Share Tech Mono',monospace;color:#16a34a">${n.unitCost?'$'+Number(n.unitCost).toFixed(2):''}</td>

                        </td>
                      </tr>`).join('')}
                    </tbody>
                  </table>

    function invDupesModalHTML() {
      const inv = data.partsInventory || [];
      const groups = {};
      inv.forEach(p => {
        const key = (p.name||'').trim().toLowerCase();
        if (!key) return;
        if (!groups[key]) groups[key] = [];
        groups[key].push(p);
      });
      const dupGroups = Object.entries(groups).filter(([k,g])=>g.length>1);

      return `<div class="modal-overlay" id="modal-bg">
        <div class="modal" style="max-width:700px">
          <div class="modal-hdr">
            <div class="modal-title">Duplicate Items</div>
            <button class="modal-close" data-action="close-modal">✕</button>
          </div>
          <div class="modal-body">
            ${dupGroups.length===0
              ? '<div class="empty"><div class="empty-icon">✓</div><div class="empty-title">No Duplicates Found</div></div>'
              : dupGroups.map(([key,parts]) => `
                <div style="margin-bottom:16px;padding:14px;background:var(--bg3);border-radius:6px;border-left:3px solid #d97706">
                  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
                    <div>
                      <span style="font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700">${esc(parts[0].name)}</span>
                      <span style="font-size:12px;color:var(--text-dim);margin-left:8px">${parts.length} entries</span>
                    </div>
                    <button class="btn btn-primary btn-sm" data-action="inv-merge-dupes" data-key="${esc(key)}">Merge All</button>
                  </div>
                  <table style="width:100%;border-collapse:collapse;font-size:13px">
                    <thead><tr style="border-bottom:1px solid var(--border)">
                      <th style="padding:4px 8px;text-align:left;color:var(--text-dim)">Part Numbers</th>
                      <th style="padding:4px 8px;text-align:center;color:var(--text-dim)">Qty</th>
                      <th style="padding:4px 8px;text-align:left;color:var(--text-dim)">Location</th>
                      <th></th>
                    </tr></thead>
                    <tbody>${parts.map((p,i)=>`<tr style="border-bottom:1px solid var(--bg3)">
                      <td style="padding:6px 8px">${(p.partNumbers||[]).map(n=>esc(n.vendor?n.vendor+' #'+n.num:n.num)).join(', ')||'—'}</td>
                      <td style="padding:6px 8px;text-align:center;font-family:'Share Tech Mono',monospace">${p.qty||'—'}</td>
                      <td style="padding:6px 8px;color:var(--text-dim)">${esc(p.location||'')}</td>
                      <td style="padding:6px 8px">${i>0?`<button class="btn btn-ghost btn-sm" style="font-size:11px" data-action="inv-merge-into" data-src="${esc(p.id)}" data-dest="${esc(parts[0].id)}">Merge↑</button>`:'<span style="font-size:11px;color:var(--text-dim)">Primary</span>'}</td>
                    </tr>`).join('')}</tbody>
                  </table>
                </div>`).join('')}
          </div>
          <div class="modal-footer">
            <button class="btn btn-ghost" data-action="close-modal">Close</button>
            ${dupGroups.length>0?`<button class="btn btn-primary" data-action="inv-merge-all-dupes">Merge All Duplicates</button>`:''}
          </div>
        </div>
      </div>`;
    }

    // ── Render: Report Tab ──────────────────────────────────────────────────
    function renderReport() {
      const records  = data.records||[];
      const vehicles = data.vehicles||[];
      const totalRecs = records.length;
      const recentCutoff = new Date(); recentCutoff.setDate(recentCutoff.getDate()-30);
      const recentRecs = records.filter(r=>new Date(r.date)>=recentCutoff).length;
      const typeCounts = {};
      records.forEach(r=>{typeCounts[r.type||'Other']=(typeCounts[r.type||'Other']||0)+1;});
      const topTypes = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
      const maxCount = topTypes[0]?.[1]||1;
      return `
        <div class="overview-title">Service Report</div>
        <div class="overview-sub">${totalRecs} total records across ${vehicles.length} equipment</div>
        <div class="summary-bar" style="margin:16px 0">
          <div class="summary-stat"><div class="summary-stat-val">${totalRecs}</div><div class="summary-stat-lbl">Total Records</div></div>
          <div class="summary-stat"><div class="summary-stat-val">${recentRecs}</div><div class="summary-stat-lbl">Last 30 Days</div></div>
          <div class="summary-stat"><div class="summary-stat-val">${vehicles.length}</div><div class="summary-stat-lbl">Equipment</div></div>
